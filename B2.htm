<SCRIPT LANGUAGE="VBSCRIPT">
Call PrintWelcome

Sub PrintWelcome
Dim h
h = Hour(Now)
If h < 12 then
Document.Write "Good morning!  "
ElseIf h < 17 then
Document.Write "Good afternoon!  "
Else
Document.Write "Good evening!  "
End If
Document.Write "Welcome to my Bronco II page.  "
Document.Write "It's "
Document.Write Time() & " on " & Date()  & "."
End Sub
</SCRIPT></CENTER></H2>

 <script language="JavaScript1.2">

var variableslide=new Array()

//variableslide[x]=["path to image", "OPTIONAL link for image", "OPTIONAL text description (supports HTML tags)"]

variableslide[0]=['pubrll.jpg',  '', 'My first Bronco II conversion, 1987, 2.9 auto.']
variableslide[1]=['blbrll.jpg', '', 'My second BII conversion. 1988 with a 2.9 and automatic.']
variableslide[2]=['Red Bll 001.jpg', '', 'This is my most recent BII conversion 1990, 2.9 with a 5spd']
variableslide[3]=['Red Bll 003.jpg', '', 'Shortend Ford Ranger bed liner in latest conversion, 1990, 5 spd.']

variableslide[4]=['Bronc plow.jpg',  '', 'My latest conversion, with Western plow installed.']

//configure the below 3 variables to set the dimension/background color of the slideshow

var slidewidth='130px' //set to width of LARGEST image in your slideshow
var slideheight='320px' //set to height of LARGEST iamge in your slideshow, plus any text description
var slidebgcolor='#F3F3F3'

//configure the below variable to determine the delay between image rotations (in miliseconds)
var slidedelay=7000

////Do not edit pass this line////////////////

var ie=document.all
var dom=document.getElementById

for (i=0;i<variableslide.length;i++){
var cacheimage=new Image()
cacheimage.src=variableslide[i][0]
}

var currentslide=0

function rotateimages(){
contentcontainer='<center>'
if (variableslide[currentslide][1]!="")
contentcontainer+='<a href="'+variableslide[currentslide][1]+'">'
contentcontainer+='<img src="'+variableslide[currentslide][0]+'" border="0" vspace="3">'
if (variableslide[currentslide][1]!="")
contentcontainer+='</a>'
contentcontainer+='</center>'
if (variableslide[currentslide][2]!="")
contentcontainer+=variableslide[currentslide][2]

if (document.layers){
crossrotateobj.document.write(contentcontainer)
crossrotateobj.document.close()
}
else if (ie||dom)
crossrotateobj.innerHTML=contentcontainer
if (currentslide==variableslide.length-1) currentslide=0
else currentslide++
setTimeout("rotateimages()",slidedelay)
}

if (ie||dom)
document.write('<div id="slidedom" style="width:'+slidewidth+';height:'+slideheight+'; background-color:'+slidebgcolor+'"></div>')

function start_slider(){
crossrotateobj=dom? document.getElementById("slidedom") : ie? document.all.slidedom : document.slidensmain.document.slidenssub
if (document.layers)
document.slidensmain.visibility="show"
rotateimages()
}

if (ie||dom)
start_slider()
else if (document.layers)
window.onload=start_slider

</script>

<ilayer id="slidensmain" width=&{slidewidth}; height=&{slideheight}; bgColor=&{slidebgcolor}; visibility=hide><layer id="slidenssub" width=&{slidewidth}; left=0 top=0></layer></ilayer></CENTER>
